<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Clock</title>
<style>
  :root {
    --bg: #1a1a1a;
    --bg-elevated: #242424;
    --gold: #d4af37;
    --gold-soft: #c9a227;
    --gold-dim: rgba(212, 175, 55, 0.35);
    --text: #f5f5f5;
    --text-muted: #a8a8a8;
    --divider: rgba(212, 175, 55, 0.22);
    --progress-track: #333333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    width: 100%;
    margin: 0;
    padding: 0;
  }

  .bar {
    background: var(--bg);
    border: 1px solid var(--gold-dim);
    border-radius: 12px;
    padding: 12px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }


  .top-row {
    display: flex;
    align-items: stretch;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand-date {
    flex: 0 1 auto;
    width: max-content;
    max-width: 100%;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding-right: 14px;
    border-right: 1px solid var(--divider);
  }

  .date-line {
    font-size: 30px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--text);
  }

  .rayday-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }

  .rayday {
    font-size: 12px;
    color: var(--gold-soft);
    font-weight: 600;
    white-space: nowrap;
  }

  .progress {
    flex: 1;
    height: 4px;
    background: var(--progress-track);
    border-radius: 2px;
    overflow: hidden;
    min-width: 60px;
    max-width: 140px;
  }

  .progress > span {
    display: block;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .clocks {
    flex: 1 1 420px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .group-label {
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
  }

  .group-grid {
    display: grid;
    gap: 6px;
  }

  .stateside .group-grid {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .overseas .group-grid {
    /* Match width of first two Stateside columns (6-col grid + 5 gaps) */
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: calc((100% - 5 * 6px) / 6 * 2 + 6px);
    max-width: 100%;
  }

  .clock {
    background: var(--bg-elevated);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 6px 8px 7px;
    text-align: center;
    min-width: 0;
  }

  .clock.home {
    border-color: var(--gold-dim);
    box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.08);
  }

  .clock .label {
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .clock.home .label {
    color: var(--gold);
  }

  .clock .time {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    line-height: 1.3;
    color: var(--text);
    white-space: nowrap;
  }

  .clock .offset {
    font-size: 9px;
    color: var(--gold-soft);
    font-weight: 600;
    line-height: 1.2;
    min-height: 0;
  }

  .clock .offset:empty {
    display: none;
  }

  /* Tablet / mid widths */
  @media (max-width: 1100px) {
    .stateside .group-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .overseas .group-grid {
      width: 100%;
      max-width: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .brand-date {
      border-right: none;
      border-bottom: 1px solid var(--divider);
      padding-right: 0;
      padding-bottom: 8px;
      flex: 1 1 100%;
    }
  }

  /* Phone */
  @media (max-width: 520px) {
    .bar { padding: 10px 10px 12px; gap: 8px; }
    .stateside .group-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .overseas .group-grid {
      width: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .clock .label {
      letter-spacing: 0.04em;
    }
    .clock .time { font-size: 13px; }
    .date-line { font-size: 28px; }
    .progress { max-width: none; }
  }
</style>
</head>
<body>
  <div class="bar" role="region" aria-label="World clocks">
    <div class="top-row">
      <div class="brand-date">
        <div class="date-line" id="dateLine">—</div>
        <div class="rayday-row">
          <div class="rayday" id="rayday">Rayday — / —</div>
          <div class="progress" aria-hidden="true"><span id="yearProgress"></span></div>
        </div>
      </div>

      <div class="clocks">
        <div class="group stateside">
          <div class="group-label">Stateside</div>
          <div class="group-grid" id="stateside"></div>
        </div>
        <div class="group overseas">
          <div class="group-label">Overseas</div>
          <div class="group-grid" id="overseas"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  const HOME_TZ = "America/New_York";

  const ZONES = [
    { id: "eastern",  label: "Eastern · Home", short: "Eastern",  tz: "America/New_York",     group: "stateside", home: true },
    { id: "central",  label: "Central",        short: "Central",  tz: "America/Chicago",      group: "stateside" },
    { id: "mountain", label: "Mountain",       short: "Mountain", tz: "America/Denver",       group: "stateside" },
    { id: "pacific",  label: "Pacific",        short: "Pacific",  tz: "America/Los_Angeles",  group: "stateside" },
    { id: "alaska",   label: "Alaska",         short: "Alaska",   tz: "America/Anchorage",    group: "stateside" },
    { id: "hawaii",   label: "Hawaii",         short: "Hawaii",   tz: "Pacific/Honolulu",     group: "stateside" },
    { id: "okinawa",  label: "Okinawa",        short: "Okinawa",  tz: "Asia/Tokyo",           group: "overseas" },
    { id: "germany",  label: "Germany",        short: "Germany",  tz: "Europe/Berlin",        group: "overseas" }
  ];

  /** Parts for a given IANA zone as a plain object. */
  function partsInZone(date, timeZone) {
    const fmt = new Intl.DateTimeFormat("en-US", {
      timeZone,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      weekday: "long",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });
    const map = {};
    for (const p of fmt.formatToParts(date)) {
      if (p.type !== "literal") map[p.type] = p.value;
    }
    return map;
  }

  /** Calendar Y-M-D integers in a zone. */
  function ymdInZone(date, timeZone) {
    const p = partsInZone(date, timeZone);
    return {
      year: +p.year,
      month: +p.month,
      day: +p.day,
      weekday: p.weekday
    };
  }

  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
  }

  function daysInYear(y) {
    return isLeapYear(y) ? 366 : 365;
  }

  /** Day-of-year (1-based) for Y-M-D using UTC math (calendar date, not local clock). */
  function dayOfYear(year, month, day) {
    const start = Date.UTC(year, 0, 1);
    const cur = Date.UTC(year, month - 1, day);
    return Math.floor((cur - start) / 86400000) + 1;
  }

  function raydayForEastern(date) {
    const { year, month, day } = ymdInZone(date, HOME_TZ);
    const doy = dayOfYear(year, month, day);
    const total = daysInYear(year);
    return { doy, total, year, month, day };
  }

  // Expose for node unit tests via global when running under jsdom/node
  if (typeof globalThis !== "undefined") {
    globalThis.__SemperPopsClock = { isLeapYear, daysInYear, dayOfYear, raydayForEastern, ymdInZone, HOME_TZ };
  }

  function buildClockCards() {
    const stateside = document.getElementById("stateside");
    const overseas = document.getElementById("overseas");
    for (const z of ZONES) {
      const el = document.createElement("div");
      el.className = "clock" + (z.home ? " home" : "");
      el.id = "clock-" + z.id;
      el.innerHTML =
        '<div class="label">' + z.label + "</div>" +
        '<div class="time" data-role="time">--:--:-- --</div>' +
        '<div class="offset" data-role="offset"></div>';
      (z.group === "stateside" ? stateside : overseas).appendChild(el);
    }
  }

  const MONTHS = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  function dayOffsetLabel(homeYmd, zoneYmd) {
    const homeKey = homeYmd.year * 10000 + homeYmd.month * 100 + homeYmd.day;
    const zoneKey = zoneYmd.year * 10000 + zoneYmd.month * 100 + zoneYmd.day;
    const diff = zoneKey - homeKey;
    // Compare as calendar ordinals via day-of-year across years carefully
    const homeOrdinal = Date.UTC(homeYmd.year, homeYmd.month - 1, homeYmd.day);
    const zoneOrdinal = Date.UTC(zoneYmd.year, zoneYmd.month - 1, zoneYmd.day);
    const days = Math.round((zoneOrdinal - homeOrdinal) / 86400000);
    if (days === 0) return "";
    if (days === 1) return "+1 day";
    if (days === -1) return "−1 day";
    if (days > 1) return "+" + days + " days";
    return days + " days";
  }

  function tick() {
    const now = new Date();
    const homeYmd = ymdInZone(now, HOME_TZ);

    // Date + Rayday (Eastern)
    const weekday = homeYmd.weekday;
    const monthName = MONTHS[homeYmd.month - 1];
    document.getElementById("dateLine").textContent =
      weekday + ", " + monthName + " " + homeYmd.day + ", " + homeYmd.year;

    const rd = raydayForEastern(now);
    document.getElementById("rayday").textContent =
      "Rayday " + rd.doy + " / " + rd.total;
    document.getElementById("yearProgress").style.width =
      ((rd.doy / rd.total) * 100).toFixed(2) + "%";

    for (const z of ZONES) {
      const p = partsInZone(now, z.tz);
      const zoneYmd = { year: +p.year, month: +p.month, day: +p.day };
      const timeStr = p.hour + ":" + p.minute + ":" + p.second + " " + p.dayPeriod;
      const card = document.getElementById("clock-" + z.id);
      card.querySelector('[data-role="time"]').textContent = timeStr;
      card.querySelector('[data-role="offset"]').textContent =
        z.home ? "" : dayOffsetLabel(homeYmd, zoneYmd);
    }
  }

  buildClockCards();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
